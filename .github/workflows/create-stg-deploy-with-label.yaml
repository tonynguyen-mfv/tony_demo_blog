name: Create Stg deploy with label
on:
  pull_request:
    types: [labeled]
env:
  APP_NAME: pfm-web
jobs:
  create_stg_deploy_with_label:
    name: Create or Update Stg deploy with label
    if: ${{ github.event.label.name == 'deploy-stg' || contains(github.event.pull_request.labels.*.name, 'deploy-stg') }}
    runs-on: ubuntu-latest
    steps:
      - name: Echo event info
        run: |
          echo "APP_NAME: ${{ env.APP_NAME }}"
          echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_base_ref: ${{ github.base_ref }}"
          echo "GITHUB_base_sha: ${{ github.event.pull_request.base.sha }}"
          echo "GITHUB_head_ref: ${{ github.head_ref }}"
          echo "GITHUB_head_sha: ${{ github.event.pull_request.head.sha }}"
          
          
          
      
      